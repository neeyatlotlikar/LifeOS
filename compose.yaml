services:
  db:
    image: postgres:18
    container_name: lifeos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos_dev_password
    ports:
      - "5432:5432"
    volumes:
      - lifeos_postgres_data:/var/lib/postgresql

volumes:
  lifeos_postgres_data:
